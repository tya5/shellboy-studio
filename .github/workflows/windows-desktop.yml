name: Windows desktop artifact (build only)
on:
  workflow_call:
    inputs:
      studio_ref:
        required: true
        type: string
      expected_sha:
        required: true
        type: string
      release_app:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_APP: ${{ inputs.release_app }}
      STUDIO_REF: ${{ inputs.studio_ref }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_ref }}
          persist-credentials: false
      - name: Verify exact Studio checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify exact Core pin and release eligibility
        id: core
        shell: bash
        run: |
          set -euo pipefail
          studio=$(git rev-parse HEAD)
          core_check=()
          if [[ "$RELEASE_APP" == true ]]; then
            version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
            [[ "$STUDIO_REF" == "refs/tags/v$version" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$studio" = "$(git rev-parse "$STUDIO_REF^{commit}")"
            core_check=(--release)
          else
            test "$studio" = "$STUDIO_REF"
          fi
          core=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["dependencies"]["shellboy"]["rev"])')
          owner="$RUNNER_TEMP/windows-owner-source"
          git init "$owner"
          git -C "$owner" remote add origin https://github.com/tya5/shellboy
          git -C "$owner" fetch --depth 1 origin "$core"
          git -C "$owner" checkout --detach "$core"
          python tools/verify-desktop-core.py --owner "$owner" "${core_check[@]}"
          echo "pin=$core" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: packaging-desktop-windows-latest-x86_64-pc-windows-msvc-rust1.99.1-windows-desktop-${{ steps.core.outputs.pin }}-${{ hashFiles('Cargo.lock') }}
          cache-workspace-crates: false
      - name: Install desktop frontend dependencies
        shell: bash
        working-directory: web
        run: npm ci
      - name: Build desktop frontend for embedding
        shell: bash
        working-directory: web
        run: npm run build
      - name: Build locked Studio desktop binary
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 build --locked --release --target "$TARGET" --features windows-desktop --bin shellboy-studio-desktop
      - name: Build locked Core binary
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/windows-owner-source"
          cargo +1.99.1 install --target-dir "$GITHUB_WORKSPACE/target" --locked --path "$owner" --root "$RUNNER_TEMP/windows-owner" --target "$TARGET"
      - name: Verify built Core binary version and pin
        shell: bash
        run: |
          set -euo pipefail
          owner="$RUNNER_TEMP/windows-owner-source"
          "$RUNNER_TEMP/windows-owner/bin/shellboy.exe" --version > "$RUNNER_TEMP/windows-owner-version.txt"
          python tools/verify-desktop-core.py --owner "$owner" --binary-version "$RUNNER_TEMP/windows-owner-version.txt"
      - name: Zip and inspect the desktop pair
        shell: bash
        env:
          CORE_PIN: ${{ steps.core.outputs.pin }}
        run: |
          set -euo pipefail
          package_mode=()
          if [[ "$RELEASE_APP" == true ]]; then package_mode=(--release-tag "${STUDIO_REF#refs/tags/}"); fi
          python tools/package-windows.py --studio "$EXPECTED_SHA" --core "$CORE_PIN" "${package_mode[@]}" \
            --studio-bin "target/$TARGET/release/shellboy-studio-desktop.exe" \
            --core-bin "$RUNNER_TEMP/windows-owner/bin/shellboy.exe" --out desktop-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release_app && 'release-desktop-windows-x64' || 'candidate-desktop-windows-x64' }}
          path: desktop-artifact/*.zip
          if-no-files-found: error
          compression-level: 0
