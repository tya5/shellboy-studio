# Required integration gate, separate from owner-free tests. Not executed locally.
name: Exact-pair owner acceptance
on:
  workflow_call:
    inputs:
      studio_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  owner:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce publication time boundary
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          assert datetime.now(timezone.utc) >= datetime(2026, 11, 8, 22, tzinfo=timezone.utc)
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.studio_ref }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the official peeled tag against the Studio lock before build
        run: |
          git init "$RUNNER_TEMP/exact-owner-source"
          git -C "$RUNNER_TEMP/exact-owner-source" remote add origin https://github.com/tya5/shellboy
          git -C "$RUNNER_TEMP/exact-owner-source" fetch --depth 1 origin refs/tags/v0.12.0:refs/tags/v0.12.0
          git -C "$RUNNER_TEMP/exact-owner-source" checkout --detach 'refs/tags/v0.12.0^{commit}'
          python3 tools/exact-owner.py --studio . --owner "$RUNNER_TEMP/exact-owner-source"
      - name: Build the verified source and assert package and binary version
        run: |
          cargo +1.99.1 install --locked --path "$RUNNER_TEMP/exact-owner-source" --root "$RUNNER_TEMP/exact-owner"
          "$RUNNER_TEMP/exact-owner/bin/shellboy" --version > "$RUNNER_TEMP/exact-owner-version.txt"
          python3 tools/exact-owner.py --studio . --owner "$RUNNER_TEMP/exact-owner-source" --binary-version "$RUNNER_TEMP/exact-owner-version.txt"
      - name: Run explicit exact-pair integration suite (temporary data and local mock)
        env:
          SHELLBOY_BIN: ${{ runner.temp }}/exact-owner/bin/shellboy
        run: |
          test -x "$SHELLBOY_BIN"
          cargo +1.99.1 test --locked --features real-owner-tests --test real_owner -- --nocapture
