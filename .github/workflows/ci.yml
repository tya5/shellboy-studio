# UNTESTED: written before the first push; it has not run on GitHub. Validated only as YAML.
name: Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build (the build is embedded into the binary)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Owner-free release preparation checks
        run: python3 tools/check-release.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Owner-free Rust checks (explicit owner suite runs separately)
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked
      - name: Embedded frontend is present in the binary
        run: |
          cargo +1.99.1 build --locked
          test -s web/dist/index.html
          ./target/debug/shellboy-studio --version

  real-owner:
    name: Required exact-pair owner acceptance
    uses: ./.github/workflows/exact-owner.yml
    with:
      studio_ref: ${{ github.sha }}
