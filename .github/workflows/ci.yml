# UNTESTED: written before the first push; it has not run on GitHub. Validated only as YAML.
name: Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      real_owner:
        description: Also run the integration test against a real `shellboy serve` built from the pinned tag (Linux only, builds Shellboy)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build (the build is embedded into the binary)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Rust checks
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked
      - name: Embedded frontend is present in the binary
        run: |
          cargo +1.99.1 build --locked
          test -s web/dist/index.html
          ./target/debug/shellboy-studio --version

  real-owner:
    name: Integration with a real owner (Linux, manual)
    if: ${{ inputs.real_owner }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build Shellboy at the tag Studio pins
        run: |
          tag=$(sed -n 's/^shellboy = .*tag = "\([^"]*\)".*/\1/p' Cargo.toml)
          echo "pinned tag: $tag"
          cargo +1.99.1 install --locked --git https://github.com/tya5/shellboy --tag "$tag" --root "$RUNNER_TEMP/shellboy" shellboy
      - name: Run the real-owner test
        env:
          SHELLBOY_BIN: ${{ runner.temp }}/shellboy/bin/shellboy
        run: cargo +1.99.1 test --locked --test real_owner -- --nocapture
