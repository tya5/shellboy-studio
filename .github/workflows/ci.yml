# Required checks retain failed conclusions while independent diagnostics continue.
name: Checks
on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      all_oses:
        description: Run Checks and exact-pair owner acceptance on all three OSes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      oses: ${{ steps.select.outputs.oses }}
      reuse: ${{ steps.select.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the Checks scope policy
        run: node --test tools/test-checks-scope.cjs
      - name: Select Checks scope
        id: select
        uses: actions/github-script@v7
        env:
          ALL_OSES: ${{ inputs.all_oses }}
        with:
          script: |
            const { scope } = require('./tools/checks-scope.cjs');
            const result = await scope({ github, context, allOses: process.env.ALL_OSES === 'true' });
            core.setOutput('oses', JSON.stringify(result.oses));
            core.setOutput('reuse', String(Boolean(result.reused)));
            if (result.reused) {
              await core.summary.addHeading('Exact-SHA Checks reused').addLink(context.sha, result.reused).write();
            } else if (result.evidenceUnavailable) {
              core.warning('Actions evidence lookup failed; running all three OSes.');
            }
  checks:
    name: Checks on ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend checks and build (the build is embedded into the binary)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run build
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.12'
      - name: Owner-free release preparation checks
        if: ${{ !cancelled() }}
        env:
          PYTHONUTF8: "1"
        run: python3 tools/check-release.py
      - name: Install pinned Rust toolchain
        if: ${{ !cancelled() }}
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ !cancelled() }}
        with:
          cache-on-failure: true
      - name: Rust format
        if: ${{ !cancelled() }}
        run: cargo +1.99.1 fmt --check
      - name: Rust clippy
        if: ${{ !cancelled() }}
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Owner-free Rust tests (explicit owner suite runs separately)
        if: ${{ !cancelled() }}
        run: cargo +1.99.1 test --locked
      - name: Check Windows desktop entry point
        if: runner.os == 'Windows'
        run: cargo +1.99.1 clippy --locked --features windows-desktop --bin shellboy-studio-desktop -- -D warnings
      - name: Embedded frontend is present in the binary
        if: ${{ !cancelled() }}
        run: |
          cargo +1.99.1 build --locked
          test -s web/dist/index.html
          ./target/debug/shellboy-studio --version

  real-owner:
    name: Required exact-pair owner acceptance
    needs: scope
    if: needs.scope.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.oses) }}
    uses: ./.github/workflows/exact-owner.yml
    with:
      studio_ref: ${{ github.sha }}
      runner_os: ${{ matrix.os }}
