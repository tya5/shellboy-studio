[package]
name = "shellboy-studio"
version = "0.2.3"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Browser UI bridge for Shellboy"
license = "MIT"
repository = "https://github.com/tya5/shellboy-studio"

[lib]
name = "shellboy_studio"
path = "src/lib.rs"

[[bin]]
name = "shellboy-studio"
path = "src/main.rs"

[[test]]
name = "real_owner"
path = "tests/real_owner.rs"
required-features = ["real-owner-tests"]

[features]
# Explicit integration suite: never part of owner-free unit/synthetic checks.
real-owner-tests = []
default = ["next-shellboy", "next-connection-setup", "next-tags", "next-cwds"]
# Pinned to published Core v0.11.2; Cargo.lock records its exact release commit.
next-shellboy = []
# #262 owner branch adds message.ask; never forward it from Studio.
next-reply = ["next-shellboy"]
# First-run connection setup (Shellboy #269): `credentials.set`, `credentials.clear`, `connection.test`.
# Published connection operations are enabled for the pinned v0.11.2 pairing;
# validate the exact owner pair (docs/design/connection-setup.md).
next-connection-setup = ["next-shellboy"]
# Thread tags (Shellboy #222 stage 3): `thread.tag`, `thread.tags`, and `tags` / `cwd` on `thread.list`.
# Validate these operations against the published tag before merging this branch.
next-tags = ["next-shellboy"]
# `thread.cwds` (the list of directories). Validate it against the published tag.
next-cwds = ["next-tags"]

[dependencies]
# Published owner pin; exact-pair acceptance verifies the tag and lock commit.
shellboy = { git = "https://github.com/tya5/shellboy", tag = "v0.11.2" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "=0.3.4"
# Apps: the hash on data files. Same version as Shellboy, so nothing new is compiled.
sha2 = "=0.11.1"

[dev-dependencies]
tokio-tungstenite = "=0.28.0"
tower = { version = "=0.5.3", features = ["util"] }
futures-util = "=0.3.34"
