[package]
name = "shellboy-studio"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Browser UI bridge for Shellboy"
license = "MIT"
repository = "https://github.com/tya5/shellboy-studio"

[lib]
name = "shellboy_studio"
path = "src/lib.rs"

[[bin]]
name = "shellboy-studio"
path = "src/main.rs"

[features]
# For developing against Shellboy main, in a copy with a [patch] of the shellboy dependency
# (docs/design/branches-threads.md). Off in every normal build: the pin stays at the tag.
next-shellboy = []
# #262 owner branch adds message.ask; never forward it from Studio.
next-reply = ["next-shellboy"]
# First-run connection setup (Shellboy #269): `credentials.set`, `credentials.clear`, `connection.test`.
# These operations are on a Shellboy branch and in no release, so this builds only against a copy
# whose [patch] points at a Shellboy that has them (docs/design/connection-setup.md). Off in every
# normal build, and off in `next-shellboy` alone, which still builds against Shellboy main.
next-connection-setup = ["next-shellboy"]
# Thread tags (Shellboy #222 stage 3): `thread.tag`, `thread.tags`, and `tags` / `cwd` on `thread.list`.
# On a Shellboy branch and in no release, so this builds only against a copy whose [patch] points at
# a Shellboy that has them (docs/design/branches-threads.md). Off in every normal build.
next-tags = ["next-shellboy"]
# `thread.cwds` (the list of directories). Not visible in any Shellboy branch yet: this feature names
# `Command::ThreadCwds` and has never been compiled. Build it only once that variant exists.
next-cwds = ["next-tags"]

[dependencies]
# Pinned to a commit on Shellboy origin/main that has `events.wait` (#243 B, C).
# No release tag contains it yet; replace by the tag when one does (docs/design/bridge.md).
shellboy = { git = "https://github.com/tya5/shellboy", tag = "v0.10.0" }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "fs", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
clap = { version = "=4.6.7", features = ["derive"] }
getrandom = "=0.3.4"
# Apps: the hash on data files. Same version as Shellboy, so nothing new is compiled.
sha2 = "=0.11.1"

[dev-dependencies]
tokio-tungstenite = "=0.28.0"
tower = { version = "=0.5.3", features = ["util"] }
futures-util = "=0.3.34"
